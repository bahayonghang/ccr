[package]
name = "ccr-gpui"
version = "7.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "CCR native GPUI desktop client"

[workspace]
resolver = "3"

[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows" }
# This workspace does not inherit the root patch. Upstream r2d2_sqlite 0.35.0
# still requires rusqlite 0.40 / libsqlite3-sys 0.38 (RUSTSEC-2026-0459).
r2d2_sqlite = { path = "../third_party/r2d2-sqlite" }

[[bin]]
name = "ccr-gpui"
path = "src/main.rs"

[dependencies]
ccr-checkin = { path = "../crates/ccr-checkin" }
reqwest = { version = "=0.13.5", default-features = false }
ccr-app = { path = "../crates/ccr-app" }
ccr-config = { path = "../crates/ccr-config" }
ccr-cli = { path = "../crates/ccr-cli" }
ccr-codex = { path = "../crates/ccr-codex" }
ccr-store = { path = "../crates/ccr-store" }
ccr-sync = { path = "../crates/ccr-sync" }
ccr-usage = { path = "../crates/ccr-usage" }
ccr-types = { path = "../crates/ccr-types" }
chrono = "=0.4.45"
dirs = "=6.0.0"
rusqlite = { version = "=0.41.1", features = ["bundled", "functions"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tokio = { version = "=1.53.3", features = ["rt", "sync", "time", "macros"] }
toml = "=1.1.8"
ccr-db = { path = "../crates/ccr-db" }
ccr-core = { path = "../crates/ccr-core" }
ccr-skills = { path = "../crates/ccr-skills" }
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component", "assets"] }

[dev-dependencies]
sha2 = "=0.11.1"
ccr-sync = { path = "../crates/ccr-sync", features = ["test-support"] }
ccr-app = { path = "../crates/ccr-app", features = ["test-fixtures"] }
ccr-cli = { path = "../crates/ccr-cli", features = ["test-support"] }
ccr-usage = { path = "../crates/ccr-usage", features = ["test-fixtures"] }
tempfile = "=3.27.0"
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component", "assets", "test-support"] }

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
