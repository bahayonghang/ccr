[workspace]

[package]
name = "ccr-desktop"
version = "5.0.1"
description = "CCR Desktop - Tauri Application"
authors = ["CCR Team"]
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
# CCR ??? - ???????
ccr = { path = "../../crates/ccr", default-features = false }

# 馃摝 CCR 绫诲瀷瀹氫箟 - Claude Settings 瀛愮被鍨?(Agent, Plugin, Hook 绛?
ccr-types = { path = "../../crates/ccr-types" }

# 馃摝 CCR 鏁版嵁搴撳眰 - SQLite 瀛樺偍銆丆heckIn 鏈嶅姟
ccr-db = { path = "../../crates/ccr-db" }

# Tauri framework
tauri = { version = "2.9.3", features = [] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "fs",
    "process",
] }

# HTTP client
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "native-tls",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.34"

# Encryption (for checkin account credentials)
aes-gcm = "0.10"

# UUID
uuid = { version = "1.21", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Database (direct access for AppState)
r2d2 = "0.8"

# Async trait support
async-trait = "0.1"

# Home directory detection
dirs = "6"

# TOML parsing (for slash commands)
toml = "0.8"

# Directory walking (for slash commands)
walkdir = "2"

# Atomic file writes
tempfile = "3"

# Error handling
thiserror = "2"
lru = "0.12"

# File locking for cache
fs4 = "0.13"

# Platform detection
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# SSH remote support (Phase C2 鈥?鏆傛湭鍚敤锛宺ussh 0.57 鐨?rand_core 棰勫彂甯冪増涓?ccr-db 鍐茬獊)
# russh = "0.57.1"
# russh-sftp = "2.1.1"

[features]
default = []
# Custom protocol for production builds
custom-protocol = ["tauri/custom-protocol"]





