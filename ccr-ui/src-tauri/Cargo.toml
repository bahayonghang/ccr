[workspace]
members = ["command-macros"]

[package]
name = "ccr-desktop"
version = "7.1.0"
description = "CCR Desktop - Tauri Application"
authors = ["Geekyhang"]
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }
serde_json = "1.0.150"

[dependencies]
# Completion-aware policy wrapper for Tauri command futures.
ccr-tauri-command-macros = { path = "command-macros" }
# CCR 核心库 - 配置管理与平台适配
ccr = { path = "../../crates/ccr", default-features = false }
ccr-core = { path = "../../crates/ccr-core" }
ccr-codex = { path = "../../crates/ccr-codex" }
ccr-config = { path = "../../crates/ccr-config" }
ccr-skills = { path = "../../crates/ccr-skills" }
ccr-store = { path = "../../crates/ccr-store" }
ccr-sync = { path = "../../crates/ccr-sync" }
ccr-checkin = { path = "../../crates/ccr-checkin" }
ccr-cli = { path = "../../crates/ccr-cli", features = ["ts"] }
ccr-usage = { path = "../../crates/ccr-usage", features = ["ts"] }
# CCR 类型定义 - Claude Settings 子类型（Agent、Plugin、Hook 等）
ccr-types = { path = "../../crates/ccr-types" }

# CCR 数据层 - SQLite 存储与 CheckIn 服务
ccr-db = { path = "../../crates/ccr-db" }

# Tauri framework
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"

# TypeScript 绑定生成（usage V2 试点：DTO 单一来源，生成物入库 + 漂移守卫）
ts-rs = { version = "11", features = ["no-serde-warnings"] }

# Async runtime
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "fs",
    "process",
] }
# 子进程取消信号（用于 llmusage sync 的 cancel 路径）
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP client
# http2: AppState.http_client 与 ccr-checkin 共用该依赖，通过 ALPN 协商 HTTP/2（native-tls 已内置 alpn）
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "native-tls",
    "http2",
] }

# Logging
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.39.3"

# Encryption (for checkin account credentials)
aes-gcm = "0.10"

# UUID
uuid = { version = "1.23.2", features = ["serde", "v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
base64 = "0.22.1"
sha2 = "0.11.0"

# Database (direct access for AppState)
r2d2 = "0.8"
rusqlite = { version = "0.39.0", features = ["bundled"] }

# Async trait support
async-trait = "0.1"

# Home directory detection
dirs = "6.0.0"

# TOML parsing (for slash commands)
toml = "0.9.8"

# Directory walking (for slash commands)
walkdir = "2.5"

# Atomic file writes
tempfile = "3.27.0"

# Error handling
thiserror = "2.0.18"
lru = "0.18.0"
notify = "8.2.0"

# Lock-free 配置快照（供同步 tray/回调读取 AppState 偏好）
arc-swap = "1"

# 高并发缓存（替代 RwLock<LruCache>，读路径无需 write 锁、内置分段）
moka = { version = "0.12", features = ["future"] }

# File locking for cache
fs4 = "1.1.0"

# Platform detection
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# SSH 远程支持（Phase C2，暂未启用：russh 0.57 的 rand_core 预发布版与 ccr-db 冲突）
# russh = "0.57.1"
# russh-sftp = "2.1.1"

[dev-dependencies]
# 服务层单测的 llmusage 投影 fixture（与主依赖 features 合并生效：ts + test-fixtures）
ccr-usage = { path = "../../crates/ccr-usage", features = ["test-fixtures"] }

[features]
default = []
# Custom protocol for production builds
custom-protocol = ["tauri/custom-protocol"]
