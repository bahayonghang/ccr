[workspace]

[package]
name = "ccr-desktop"
version = "6.2.3"
description = "CCR Desktop - Tauri Application"
authors = ["CCR Team"]
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
# CCR 核心库 - 配置管理与平台适配
ccr = { path = "../../crates/ccr", default-features = false }
ccr-core = { path = "../../crates/ccr-core" }
ccr-codex = { path = "../../crates/ccr-codex" }
ccr-config = { path = "../../crates/ccr-config" }
ccr-skills = { path = "../../crates/ccr-skills" }
ccr-store = { path = "../../crates/ccr-store" }
ccr-sync = { path = "../../crates/ccr-sync" }
ccr-checkin = { path = "../../crates/ccr-checkin" }
ccr-cli = { path = "../../crates/ccr-cli" }
# CCR 类型定义 - Claude Settings 子类型（Agent、Plugin、Hook 等）
ccr-types = { path = "../../crates/ccr-types" }

# CCR 数据层 - SQLite 存储与 CheckIn 服务
ccr-db = { path = "../../crates/ccr-db" }

# Tauri framework
tauri = { version = "=2.10.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1.49", features = [
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
    "sync",
    "fs",
    "process",
] }
# 子进程取消信号（用于 llmusage sync 的 cancel 路径）
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP client
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "native-tls",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.38.4"

# Encryption (for checkin account credentials)
aes-gcm = "0.10"

# UUID
uuid = { version = "1.21", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22.1"
sha2 = "0.11.0"

# Database (direct access for AppState)
r2d2 = "0.8"
rusqlite = { version = "0.39.0", features = ["bundled"] }

# Async trait support
async-trait = "0.1"

# Home directory detection
dirs = "6"

# TOML parsing (for slash commands)
toml = "0.9.8"

# Directory walking (for slash commands)
walkdir = "2"

# Atomic file writes
tempfile = "3.27.0"

# Error handling
thiserror = "2"
lru = "0.16.3"
notify = "8.2.0"

# Lock-free 配置快照（供同步 tray/回调读取 AppState 偏好）
arc-swap = "1"

# 高并发缓存（替代 RwLock<LruCache>，读路径无需 write 锁、内置分段）
moka = { version = "0.12", features = ["future"] }

# File locking for cache
fs4 = "0.13"

# Platform detection
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# SSH 远程支持（Phase C2，暂未启用：russh 0.57 的 rand_core 预发布版与 ccr-db 冲突）
# russh = "0.57.1"
# russh-sftp = "2.1.1"

[features]
default = []
# Custom protocol for production builds
custom-protocol = ["tauri/custom-protocol"]
