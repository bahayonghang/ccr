<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR UI</title>
    <meta name="description" content="Operational console for managing AI CLI tools, runtimes, skills, and sync workflows">
    <link rel="preload" href="/fonts/maplebright/MapleBright-Regular/startup.css" as="style">
    <link rel="stylesheet" href="/fonts/maplebright/MapleBright-Regular/startup.css">

    <!-- 主题预初始化：在任何 CSS 加载前同步设置，消除 FOUC -->
    <script>
      (function(){
        var t=localStorage.getItem('ccr-theme')||'light';
        document.documentElement.classList.toggle('dark',t==='dark');
        document.documentElement.setAttribute('data-theme',t);
      })();
    </script>

    <!-- 关键内联样式：首帧即可见，不依赖任何外部资源 -->
    <style>
      body { margin:0; }
      #app-loader {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        height:100vh; gap:16px;
        background:#f5f5f7; color:#1d1d1f;
        font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
        transition: background 0.3s, color 0.3s;
      }
      [data-theme="dark"] #app-loader {
        background:#000000; color:#f5f5f7;
      }
      .loader-spinner {
        width:36px; height:36px;
        border:3px solid rgba(29,29,31,0.12); border-top-color:#0071e3;
        border-radius:50%; animation:spin .8s linear infinite;
      }
      [data-theme="dark"] .loader-spinner {
        border-color:rgba(255,255,255,0.12); border-top-color:#2997ff;
      }
      .loader-text { font-size:14px; opacity:0.7; }
      .loader-text {
        font-family:"MapleBright",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
        font-size:18px;
        letter-spacing:-0.04em;
        opacity:0.9;
      }
      @keyframes spin { to { transform:rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">CCR UI</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
