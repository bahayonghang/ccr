<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR UI</title>
    <meta name="description" content="Operational console for managing AI CLI tools, runtimes, configuration, and sync workflows">
    <!-- 主题预初始化：在任何 CSS 加载前同步设置，消除 FOUC -->
    <script>
      (function(){
        var root=document.documentElement;
        var theme=localStorage.getItem('ccr-theme')||'light';
        var flavor=localStorage.getItem('ccr-flavor')||'neutral';
        var accent=localStorage.getItem('ccr-accent')||'clay';
        var flavors=['neutral','clay'];
        var accents=['clay'];
        // 与 src/utils/themeBootstrap.ts 的迁移表保持一致：旧值域映射 → 白名单校验 → 默认回退。
        var flavorMigration={paper:'neutral',graphite:'neutral',catppuccin:'neutral',latte:'neutral',frappe:'neutral',macchiato:'neutral',mocha:'neutral'};
        var accentMigration={mauve:'clay',sage:'clay',sky:'clay',slate:'clay',sand:'clay',amber:'clay',rose:'clay'};
        if(Object.prototype.hasOwnProperty.call(flavorMigration,flavor)){flavor=flavorMigration[flavor];}
        if(Object.prototype.hasOwnProperty.call(accentMigration,accent)){accent=accentMigration[accent];}
        if(flavors.indexOf(flavor)<0){flavor='neutral';}
        if(accents.indexOf(accent)<0){accent='clay';}
        var resolvedTheme=theme==='dark'?'dark':'light';
        if(theme==='system'){
          resolvedTheme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
        }
        var resolvedFlavor=flavor;
        root.classList.toggle('dark',resolvedTheme==='dark');
        root.setAttribute('data-theme',resolvedTheme);
        root.setAttribute('data-flavor',flavor);
        root.setAttribute('data-resolved-flavor',resolvedFlavor);
        root.setAttribute('data-accent',accent);
        // 字体覆盖：把用户字体 prepend 到内置回退栈头，首帧即生效避免闪烁。
        // 值在写入时已由 fontPreferences.sanitizeFontFamily 净化，这里做轻量二次剥离。
        var cleanFont=function(s){return (s||'').replace(/["'`\\;{}<>(),]/g,'').replace(/\s+/g,' ').trim().slice(0,64).trim();};
        var fUi=cleanFont(localStorage.getItem('ccr-font-ui'));
        var fCode=cleanFont(localStorage.getItem('ccr-font-code'));
        if(fUi){
          root.style.setProperty('--font-sans','"'+fUi+'", var(--font-sans-base)');
          root.style.setProperty('--font-brand','"'+fUi+'", var(--font-brand-base)');
        }
        if(fCode){
          root.style.setProperty('--font-mono','"'+fCode+'", var(--font-mono-base)');
        }
      })();
    </script>

    <!-- 关键内联样式：首帧即可见，不依赖任何外部资源 -->
    <style>
      body { margin:0; }
      #app-loader {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        height:100vh; gap:16px;
        background:#e9e4d8; color:#1d1d1f;
        font-family:'MapleBright','SF Pro Text','PingFang SC','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
        transition: background 0.3s, color 0.3s;
      }
      [data-theme="dark"] #app-loader {
        background:#100f0c; color:#f5f5f7;
      }
      .loader-spinner {
        width:36px; height:36px;
        border:3px solid rgba(29,29,31,0.12); border-top-color:#0071e3;
        border-radius:50%; animation:spin .8s linear infinite;
      }
      [data-theme="dark"] .loader-spinner {
        border-color:rgba(255,255,255,0.12); border-top-color:#f0a32b;
      }
      .loader-text { font-size:14px; opacity:0.7; }
      .loader-text {
        font-family:"MapleBright","SF Pro Text","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
        font-size:18px;
        letter-spacing:-0.04em;
        opacity:0.9;
      }
      @keyframes spin { to { transform:rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">CCR UI</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
