<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR UI - AI CLI Configuration Manager</title>
    <meta name="description" content="Modern web console for managing AI CLI tool configurations">

    <!-- 主题预初始化：在任何 CSS 加载前同步设置，消除 FOUC -->
    <script>
      (function(){
        var t=localStorage.getItem('ccr-theme')||'light';
        document.documentElement.classList.toggle('dark',t==='dark');
        document.documentElement.setAttribute('data-theme',t);
      })();
    </script>

    <!-- 关键内联样式：首帧即可见，不依赖任何外部资源 -->
    <link rel="stylesheet" href="/fonts/maplebright/MapleBright-Regular/result.css">
    <link rel="stylesheet" href="/fonts/maplebright/MapleBright-Medium/result.css">
    <link rel="stylesheet" href="/fonts/maplebright/MapleBright-Italic/result.css">
    <link rel="stylesheet" href="/fonts/maplebright/MapleBright-MediumItalic/result.css">
    <style>
      body { margin:0; }
      #app-loader {
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        height:100vh; gap:16px;
        background:#FFF5F7; color:#6B4C6E;
        font-family:system-ui,-apple-system,sans-serif;
        transition: background 0.3s, color 0.3s;
      }
      [data-theme="dark"] #app-loader {
        background:#1A0A20; color:#F9A8D4;
      }
      .loader-spinner {
        width:36px; height:36px;
        border:3px solid #F9D4E2; border-top-color:#F472B6;
        border-radius:50%; animation:spin .8s linear infinite;
      }
      [data-theme="dark"] .loader-spinner {
        border-color:#44225A; border-top-color:#F9A8D4;
      }
      .loader-text { font-size:14px; opacity:0.7; }
      @keyframes spin { to { transform:rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">CCR Desktop</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
