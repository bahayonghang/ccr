[package]
name = "ccr-ui-backend"
version = "4.2.5"
edition = "2024"

[dependencies]
# 🎯 CCR 核心库 - 直接使用服务层（无子进程开销）
# 开发时使用路径依赖（在 workspace 中自动覆盖）
# 独立构建如需脱离仓库，可改为 git 依赖
ccr = { path = "../..", default-features = false }

# 🎯 共享类型定义
ccr-types = { path = "../../ccr-types" }

# ═══════════════════════════════════════════════════════════
# 📦 核心依赖（显式版本，支持独立构建）
# ═══════════════════════════════════════════════════════════

# Web framework (Axum + Tower ecosystem)
axum = { version = "0.8.8", features = [
    "json",
    "tokio",
    "http1",
    "query",
    "form",
    "macros",
    "ws",
] } # Web 服务框架 (核心 HTTP 处理)
tower = { version = "0.5.2", features = ["timeout", "limit"] } # 服务中间件 (超时、限流等)
tower-http = { version = "0.6.8", features = [
    "fs",
    "trace",
    "cors",
    "compression-full",
    "request-id",
    "util",
] } # HTTP 特定中间件 (CORS, 压缩, 静态文件)
futures-util = "0.3" # 异步编程工具集 (Stream/Future 扩展)

# Async runtime
tokio = { version = "1.49.0", features = ["full"] } # 异步运行时 (全功能版)
tokio-util = { version = "0.7", features = ["rt"] }  # 异步工具 (CancellationToken)

# Serialization
serde = { version = "1.0.228", features = ["derive"] } # 序列化框架
serde_json = "1.0.148"                                 # JSON 处理
indexmap = "2.12"                                      # 有序 Map (保持配置顺序)
scraper = "0.25.0"                                     # HTML 解析

# Time
chrono = { version = "0.4.42", features = ["serde"] } # 时间日期处理

# Error handling
thiserror = "2.0.17" # 自定义错误类型
anyhow = "1.0"       # 灵活错误处理

# Config file parsing
toml = "0.9.8" # TOML 解析
dirs = "6.0.0" # 系统目录获取

# ═══════════════════════════════════════════════════════════
# 📦 Backend 专有依赖
# ═══════════════════════════════════════════════════════════

# Async helpers
futures = "0.3"      # 异步原语 (Future trait 等)
async-stream = "0.3" # 异步流宏 (用于 SSE/WebSocket)

# Parallel processing
rayon = "1.10"      # 并行计算 (数据处理加速)
lazy_static = "1.5" # 静态变量懒加载

# Logging
tracing = "0.1.44" # 结构化日志门面
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "json",
    "fmt",
    "ansi",
] } # 日志订阅者 (输出到控制台/文件)
tracing-appender = "0.2.4" # 非阻塞日志写入
tracing-log = "0.2" # log crate 兼容层

# CLI arguments
clap = { version = "4.5.54", features = ["derive"] } # 命令行参数解析

# System information
whoami = "2.0.0"    # 获取当前用户身份
num_cpus = "1.17.0" # 获取 CPU 核心数
sysinfo = "0.38.1"  # 系统状态监控 (统一版本)

# HTTP client for checking updates and checkin API calls
# NOTE: Enable `gzip` to transparently decode provider responses (see NeuraDock).
reqwest = { version = "0.13.1", features = [
    "blocking",
    "json",
    "cookies",
    "gzip",
] } # HTTP 客户端 (支持 Cookie/Gzip)

# YAML support (for special cases)
serde_yaml = "0.9.33" # YAML 格式支持

# Atomic file operations
tempfile = "3.24.0" # 临时文件处理

# File system utilities
walkdir = "2.5" # 递归目录遍历
rfd = "0.15"    # 原生文件对话框 (文件夹选择器)

# UUID generation
uuid = { version = "1.18", features = ["v4", "serde"] } # UUID 生成

# Lazy static initialization
once_cell = "1.21" # 单次初始化原语

# ═══════════════════════════════════════════════════════════
# 📦 SQLite 统一存储依赖 (Unified Storage)
# ═══════════════════════════════════════════════════════════

# SQLite database (embedded, zero-config)
rusqlite = { version = "0.38", features = ["bundled"] }

# Connection pool for SQLite
r2d2 = "0.8"
r2d2_sqlite = "0.32" # SQLite 连接池

# ═══════════════════════════════════════════════════════════
# 📦 签到功能依赖 (Checkin Feature)
# ═══════════════════════════════════════════════════════════

# AES-256-GCM encryption for API key storage
aes-gcm = "0.10" # AES-GCM 加密 (敏感数据保护)

# Random key generation
rand = "0.10.0" # 随机数生成

# Base64 encoding for encrypted data
base64 = "0.22" # Base64 编解码

# Browser automation (for WAF bypass)
chromiumoxide = { version = "0.8", features = [
    "tokio-runtime",
] } # Headless Chrome (用于过 WAF)
sha2 = "0.10.9"

# ✅ 独立构建支持说明：
# - 所有依赖使用显式版本号，不依赖 workspace 继承
# - 支持复制到 ~/.ccr/ccr-ui/ 后独立构建
# - 版本号与主仓库 Cargo.toml 的 workspace.dependencies 保持同步

[dev-dependencies]
proptest = "1.6" # 属性测试框架 (用于复杂测试用例生成)
