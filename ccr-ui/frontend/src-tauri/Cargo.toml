[workspace]

[package]
name = "ccr-desktop"
version = "4.2.5"
description = "CCR Desktop - Tauri Application"
authors = ["CCR Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
# 🎯 CCR 核心库 - 直接使用服务层
ccr = { path = "../../../", default-features = false }

# Tauri framework
tauri = { version = "2.9.3", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.42", features = [
    "rt-multi-thread",
    "io-util",
    "net",
    "time",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Custom protocol for production builds
custom-protocol = ["tauri/custom-protocol"]
