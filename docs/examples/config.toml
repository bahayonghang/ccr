# CCR 统一平台注册表示例
# 由 `ccr <claude|codex|grok> profile init` 自动生成与维护（路径: ~/.ccr/config.toml）

default_platform = "claude"
current_platform = "claude"

[claude]
enabled = true
current_profile = "anthropic"
description = "Claude Code"

[codex]
enabled = true
current_profile = "duckcoding"
description = "Codex CLI"

[grok]
enabled = true
current_profile = "official"
description = "Grok Build"

[gemini]
enabled = true
description = "Antigravity CLI (legacy compatibility adapter, key: gemini)"

