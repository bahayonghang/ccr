# Grok Build config.toml example
# Copy to a GROK_HOME/config.toml only after reviewing the values.

[models]
default = "custom"
default_reasoning_effort = "high"

[model.custom]
name = "Example Grok-compatible relay"
model = "grok-example"
base_url = "https://api.example.com/v1"
api_backend = "responses"
api_key = "sk-your-grok-relay-api-key"
context_window = 1000000
supports_backend_search = true
supports_reasoning_effort = true
reasoning_effort = "high"

# CCR preserves unrelated sections structurally.
[ui]
theme = "system"
