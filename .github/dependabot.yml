version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, rust]
  - package-ecosystem: cargo
    directory: /ccr-ui/src-tauri
    schedule:
      interval: monthly
    labels: [dependencies, tauri]
  - package-ecosystem: bun
    directory: /ccr-ui
    schedule:
      interval: monthly
    labels: [dependencies, frontend]
  - package-ecosystem: npm
    directory: /ccr-vscode
    schedule:
      interval: monthly
    labels: [dependencies, vscode]
    # @types/vscode 的声明下限不能高于 engines.vscode（当前 ^1.85.0）。
    # vsce package 会直接拒绝，所以不接收更高版本的类型更新。
    ignore:
      - dependency-name: "@types/vscode"
        versions: [">1.85.0"]
  - package-ecosystem: bun
    directory: /docs
    schedule:
      interval: monthly
    labels: [dependencies, docs]
