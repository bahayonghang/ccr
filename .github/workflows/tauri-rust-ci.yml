name: Tauri Rust CI

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main]

# No pull_request path filter. Tauri Linux Required must be reported even
# when this surface is skipped, or the pull request cannot merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  changes:
    name: Tauri Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect Tauri changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/ci_surface_policy.py --surface tauri --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  tauri-linux-required:
    name: Tauri Linux Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: tauri-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: ccr-ui/src-tauri
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install just
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh just
      - name: Run local Tauri gate
        run: just tauri-ci

  tauri-platform-smoke:
    name: Tauri Smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: tauri-smoke-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: |
            .
            ccr-ui/src-tauri
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
      - name: Install just
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh just
      - name: Run platform process smoke
        run: just tauri-process-smoke

  tauri-coverage:
    name: Tauri Gateway Coverage 85
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: tauri-cov-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: ccr-ui/src-tauri
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install just and cargo-llvm-cov
        shell: bash
        run: |
          bash scripts/ci/install_prebuilt_tool.sh just
          bash scripts/ci/install_prebuilt_tool.sh cargo-llvm-cov
      - name: Collect Tauri coverage and enforce gateway threshold
        run: just coverage-tauri
      - name: Upload Tauri coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tauri-rust-coverage
          path: ccr-ui/src-tauri/target/coverage-tauri.json
          if-no-files-found: error
          retention-days: 14

  tauri-required:
    name: Tauri Linux Required
    if: ${{ always() }}
    needs: [changes, tauri-linux-required, tauri-platform-smoke, tauri-coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant Tauri results
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LINUX: ${{ needs.tauri-linux-required.result }}
          PLATFORM: ${{ needs.tauri-platform-smoke.result }}
          COVERAGE: ${{ needs.tauri-coverage.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "Tauri validation is not relevant to this pull request."
            exit 0
          fi
          for result in "$LINUX" "$PLATFORM" "$COVERAGE"; do
            test "$result" = success
          done
