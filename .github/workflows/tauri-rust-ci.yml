name: Tauri Rust CI

on:
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read

jobs:
  changes:
    name: Tauri Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect Tauri changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/ci_surface_policy.py --surface tauri --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  tauri-linux-required:
    name: Tauri Linux Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Setup Bun 1.3.10
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - name: Install Linux and repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo install just --version 1.57.0 --locked
      - name: Run local Tauri gate
        run: just tauri-ci

  tauri-platform-smoke:
    name: Tauri Smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install just
        run: cargo install just --version 1.57.0 --locked
      - name: Run platform process smoke
        run: just tauri-process-smoke

  tauri-coverage:
    name: Tauri Gateway Coverage 85
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Install Linux and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          cargo install just --version 1.57.0 --locked
          curl -L --fail --retry 3 -o cargo-llvm-cov.tar.gz https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168  cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf cargo-llvm-cov.tar.gz -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Collect Tauri coverage and enforce gateway threshold
        run: just coverage-tauri
      - name: Upload Tauri coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tauri-rust-coverage
          path: ccr-ui/src-tauri/target/coverage-tauri.json
          if-no-files-found: error
          retention-days: 14

  tauri-required:
    name: Tauri Linux Required
    if: ${{ always() }}
    needs: [changes, tauri-linux-required, tauri-platform-smoke, tauri-coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant Tauri results
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          LINUX: ${{ needs.tauri-linux-required.result }}
          PLATFORM: ${{ needs.tauri-platform-smoke.result }}
          COVERAGE: ${{ needs.tauri-coverage.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "Tauri validation is not relevant to this pull request."
            exit 0
          fi
          for result in "$LINUX" "$PLATFORM" "$COVERAGE"; do
            test "$result" = success
          done
