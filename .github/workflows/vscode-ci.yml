name: VS Code CI

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main]

# No pull_request path filter. VS Code Required still reports when this
# surface is irrelevant, so a docs-only pull request can merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  changes:
    name: VS Code Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect VS Code changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/ci_surface_policy.py --surface vscode --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  vscode-required:
    name: VS Code Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node 24.20.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: ccr-vscode/package-lock.json
      - name: Install just
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh just
      - name: Run local VS Code gate and validate final VSIX
        run: just vscode-ci
      - name: Run VS Code coverage gate
        run: just vscode-coverage | tee vscode-coverage.txt
        shell: bash
      - name: Upload VS Code coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vscode-coverage
          path: vscode-coverage.txt
          if-no-files-found: error
          retention-days: 14

  vscode-required-gate:
    name: VS Code Required
    if: ${{ always() }}
    needs: [changes, vscode-required]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant VS Code result
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VALIDATION: ${{ needs.vscode-required.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "VS Code validation is not relevant to this pull request."
            exit 0
          fi
          test "$VALIDATION" = success
