name: Frontend CI

on:
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read

jobs:
  changes:
    name: Frontend Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect frontend changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/ci_surface_policy.py --surface frontend --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  frontend-required:
    name: Vue and Docs Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Setup Rust for just
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Install just
        run: cargo install just --version 1.58.0 --locked
      - name: Run local frontend gate
        run: just frontend-check
      - name: Run Vue coverage gate
        run: just frontend-coverage
      - name: Audit frontend dependencies
        run: just frontend-audit
      - name: Upload Vue coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vue-coverage
          path: ccr-ui/coverage
          if-no-files-found: error
          retention-days: 14

  frontend-required-gate:
    name: Vue and Docs Required
    if: ${{ always() }}
    needs: [changes, frontend-required]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant frontend result
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VALIDATION: ${{ needs.frontend-required.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "Frontend validation is not relevant to this pull request."
            exit 0
          fi
          test "$VALIDATION" = success
