name: Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v 开头的 tag (如 v2.4.2)

# 🔐 权限配置 - 修复 "Resource not accessible by integration" 错误
permissions:
  contents: write  # 需要写入权限以创建 release

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ccr

jobs:
  # 🏗️ 多平台构建并发布
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU (主流发行版)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            
          # Windows (主流桌面系统)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            
          # macOS Apple Silicon (M系列芯片)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build -p ccr --release --target ${{ matrix.target }} --all-features
        shell: bash

      - name: Prepare release assets (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz ${{ env.PROJECT_NAME }}
          shasum -a 256 ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz > ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          mv ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.tar.gz* ../../../
        shell: bash

      - name: Prepare release assets (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip ${{ env.PROJECT_NAME }}.exe
          sha256sum ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip > ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip.sha256
          mv ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.zip* ../../../
        shell: bash

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            ${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
          body: |
            ## CCR ${{ steps.get_version.outputs.version }}
            
            ### 📥 下载链接
            
            选择适合你系统的版本：
            
            - **Linux x86_64 (GNU)**：适用于大多数 Linux 发行版（Ubuntu/Debian/Fedora/Arch 等）
            - **Windows x86_64**：适用于 Windows 10/11 64位系统
            - **macOS Apple Silicon (ARM64)**：适用于 M1/M2/M3/M4 芯片的 Mac
            
            ### 📋 更新日志
            
            请查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            
            ### 🚀 快速安装
            
            **Linux/macOS:**
            ```bash
            # 下载并安装 (替换为你的平台对应的文件)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ccr-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv ccr /usr/local/bin/
            
            # 验证安装
            ccr --version
            ```
            
            **Windows:**
            ```powershell
            # 下载 zip 文件后解压到 PATH 路径
            # 验证安装
            ccr.exe --version
            ```
            
            **使用 Cargo 安装:**
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }}
            ```
            
            ### 🔒 校验和验证
            
            所有文件都提供了 SHA256 校验和，请验证下载文件的完整性：
            
            ```bash
            # Linux/macOS
            sha256sum -c ccr-${{ steps.get_version.outputs.version }}-<target>.tar.gz.sha256
            
            # Windows (PowerShell)
            Get-FileHash ccr-${{ steps.get_version.outputs.version }}-<target>.zip -Algorithm SHA256
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🖥️ Tauri 桌面应用构建
  build-tauri:
    name: Build Tauri ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ccr-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ccr-ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ccr-ui
          tagName: ${{ github.ref_name }}
          releaseName: 'CCR ${{ github.ref_name }}'
          releaseBody: 'See the release notes for details.'
          releaseDraft: false
          prerelease: false

  # 📢 发布后汇总
  post-release:
    name: Post Release Summary
    needs: [build-and-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## ✅ Release ${{ steps.get_version.outputs.version }} 构建完成！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 CLI 产物（3个主流平台）" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 文件 | 校验和 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux | \`ccr-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz\` | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows | \`ccr-${{ steps.get_version.outputs.version }}-x86_64-pc-windows-msvc.zip\` | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS ARM | \`ccr-${{ steps.get_version.outputs.version }}-aarch64-apple-darwin.tar.gz\` | ✓ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🖥️ 桌面应用 (Tauri)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 格式 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux | AppImage, deb |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows | msi, exe |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS | dmg, app |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 链接" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [📥 下载 Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [📋 查看所有版本](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
