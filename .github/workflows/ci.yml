name: Root CI

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main]

# Do not add pull_request paths or paths-ignore. A skipped workflow never
# reports Root Workspace Required, and branch protection then waits forever.
# README and docs prose are ignored by scripts/ci/ci_surface_policy.py instead.
# A new push to the same pull request cancels the older run. Pushes to main
# do not cancel, so every main commit runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  changes:
    name: Root Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Detect root workspace changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/ci_surface_policy.py --surface root --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  workspace-quality:
    name: Root Workspace Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: root-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: .
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true
          env-vars: RUSTFLAGS
      - name: Setup Bun 1.4.0 for harness tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Setup Node 24.20.0 for Copilot tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
      - name: Install just
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh just
      - name: Version and governance checks
        run: just version-check
      - name: Workflow governance checks
        run: just workflow-governance-check
      - name: Format check
        run: just fmt-check
      - name: OMP context regression tests
        run: just omp-check
      - name: Harness contract tests and checks
        run: just harness-check
      - name: Copilot asset tests and checks
        run: just copilot-check
      - name: Strict clippy
        run: just lint-strict
      - name: Parallel workspace tests
        run: just test
      - name: Workspace build check
        run: just check-workspace

  workspace-msrv:
    name: Root MSRV 1.95
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust MSRV 1.95.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: root-msrv-1.95-${{ runner.os }}
          add-job-id-key: false
          workspaces: .
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --all-features

  workspace-coverage:
    name: Root Coverage 70-85
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: root-cov-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: .
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true
          env-vars: RUSTFLAGS
      - name: Install native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
      - name: Install just and cargo-llvm-cov
        shell: bash
        run: |
          bash scripts/ci/install_prebuilt_tool.sh just
          bash scripts/ci/install_prebuilt_tool.sh cargo-llvm-cov
      - name: Enforce coverage thresholds
        run: just coverage-rust
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-workspace-coverage
          path: target/coverage-workspace.json
          if-no-files-found: error
          retention-days: 14

  workspace-platform-tests:
    name: Root Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ccr1
          shared-key: root-1.98-${{ runner.os }}
          add-job-id-key: false
          workspaces: .
          cache-all-crates: false
          cache-workspace-crates: false
          cache-bin: false
          cache-on-failure: true
          env-vars: RUSTFLAGS
      - name: Install just
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh just
      - name: Run parallel workspace tests
        run: just test

  security-audit:
    name: Rust Security Audit
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Install cargo-audit
        shell: bash
        run: bash scripts/ci/install_prebuilt_tool.sh cargo-audit
      - name: Audit both independent lockfiles
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file ccr-ui/src-tauri/Cargo.lock

  root-required:
    name: Root Workspace Required
    if: ${{ always() }}
    needs: [changes, workspace-quality, workspace-msrv, workspace-coverage, workspace-platform-tests, security-audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant root results
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          QUALITY: ${{ needs.workspace-quality.result }}
          MSRV: ${{ needs.workspace-msrv.result }}
          COVERAGE: ${{ needs.workspace-coverage.result }}
          PLATFORM: ${{ needs.workspace-platform-tests.result }}
          AUDIT: ${{ needs.security-audit.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "Root workspace validation is not relevant to this pull request."
            exit 0
          fi
          for result in "$QUALITY" "$MSRV" "$COVERAGE" "$PLATFORM" "$AUDIT"; do
            test "$result" = success
          done
