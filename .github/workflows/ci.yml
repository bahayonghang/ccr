name: Root CI

on:
  pull_request:
    branches: [main, develop, dev]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  workspace-quality:
    name: Root Workspace Required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install native and repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
          cargo install just --version 1.57.0 --locked
      - name: Version and governance checks
        run: just version-check
      - name: Workflow governance checks
        run: just workflow-governance-check
      - name: Format check
        run: just fmt-check
      - name: Strict clippy
        run: just lint-strict
      - name: Parallel workspace tests
        run: just test
      - name: Workspace build check
        run: just check-workspace

  workspace-coverage:
    name: Root Coverage 70-85
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
          cargo install just --version 1.57.0 --locked
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce coverage thresholds
        run: just coverage-rust
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-workspace-coverage
          path: target/coverage-workspace.json
          if-no-files-found: error
          retention-days: 14

  workspace-platform-tests:
    name: Root Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install just
        run: cargo install just --version 1.57.0 --locked
      - name: Run parallel workspace tests
        run: just test

  security-audit:
    name: Rust Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit lockfile
        run: cargo audit
