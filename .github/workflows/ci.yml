name: Root CI

on:
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  changes:
    name: Root Change Detection
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Detect root workspace changes
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/ci_surface_policy.py --surface root --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  workspace-quality:
    name: Root Workspace Validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install native and repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
          cargo install just --version 1.57.0 --locked
      - name: Version and governance checks
        run: just version-check
      - name: Workflow governance checks
        run: just workflow-governance-check
      - name: Format check
        run: just fmt-check
      - name: Strict clippy
        run: just lint-strict
      - name: Parallel workspace tests
        run: just test
      - name: Workspace build check
        run: just check-workspace

  workspace-coverage:
    name: Root Coverage 70-85
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev
          cargo install just --version 1.57.0 --locked
          curl -L --fail --retry 3 -o cargo-llvm-cov.tar.gz https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168  cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf cargo-llvm-cov.tar.gz -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Enforce coverage thresholds
        run: just coverage-rust
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-workspace-coverage
          path: target/coverage-workspace.json
          if-no-files-found: error
          retention-days: 14

  workspace-platform-tests:
    name: Root Tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install just
        run: cargo install just --version 1.57.0 --locked
      - name: Run parallel workspace tests
        run: just test

  security-audit:
    name: Rust Security Audit
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit lockfile
        run: cargo audit

  root-required:
    name: Root Workspace Required
    if: ${{ always() }}
    needs: [changes, workspace-quality, workspace-coverage, workspace-platform-tests, security-audit]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce relevant root results
        env:
          DETECTION: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          QUALITY: ${{ needs.workspace-quality.result }}
          COVERAGE: ${{ needs.workspace-coverage.result }}
          PLATFORM: ${{ needs.workspace-platform-tests.result }}
          AUDIT: ${{ needs.security-audit.result }}
        run: |
          set -eu
          test "$DETECTION" = success
          if [ "$RELEVANT" != true ]; then
            echo "Root workspace validation is not relevant to this pull request."
            exit 0
          fi
          for result in "$QUALITY" "$COVERAGE" "$PLATFORM" "$AUDIT"; do
            test "$result" = success
          done
