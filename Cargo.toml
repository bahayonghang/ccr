[workspace]
members = ["crates/ccr", "crates/ccr-db", "crates/ccr-types"]
default-members = ["crates/ccr"]
resolver = "3"

[workspace.package]
version = "5.3.6"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

# CLI
clap = { version = "4.6.0", features = ["cargo", "derive"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# HTTP client
# Note: default-features = false disables rustls + aws-lc-rs (needs cmake/C build).
# native-tls uses the OS TLS stack (SChannel on Windows), much faster to compile.
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "native-tls",
    "cookies",
    "gzip",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Utilities
dirs = "6.0.0"
tempfile = "3.27.0"

# Database
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33.0"

# Logging
tracing = "0.1.43"

# Identity & Crypto
uuid = { version = "1.22.0", features = ["serde", "v4"] }
aes-gcm = "0.10"
rand = "0.10.0"
sha2 = "0.10.9"
base64 = "0.22.1"
blake3 = "1.8.3"

# Extra utilities
indexmap = { version = "2.13.0", features = ["serde"] }
once_cell = "1.21.4"
walkdir = "2.5"
futures = "0.3.32"
async-stream = "0.3"

# Web framework
axum = { version = "0.8.6", default-features = false, features = [
    "form",
    "http1",
    "json",
    "query",
    "tokio",
] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.8", default-features = false, features = [
    "cors",
] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.test]
inherits = "dev"

[profile.test.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = false
