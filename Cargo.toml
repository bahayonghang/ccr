[workspace]
members = [
    "crates/ccr",
    "crates/ccr-core",
    "crates/ccr-config",
    "crates/ccr-sync",
    "crates/ccr-skills",
    "crates/ccr-store",
    "crates/ccr-codex",
    "crates/ccr-db",
    "crates/ccr-checkin",
    "crates/ccr-cli",
    "crates/ccr-tui",
    "crates/ccr-types",
]
default-members = ["crates/ccr"]
resolver = "3"

[workspace.package]
version = "6.3.2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

# CLI
clap = { version = "4.6.1", features = ["cargo", "derive"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# HTTP client
# Note: default-features = false disables rustls + aws-lc-rs (needs cmake/C build).
# native-tls uses the OS TLS stack (SChannel on Windows), much faster to compile.
# http2: 签到等外部请求通过 ALPN 协商 HTTP/2，贴近真实浏览器指纹（native-tls 已内置 alpn）。
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
    "cookies",
    "gzip",
    "http2",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Utilities
dirs = "6.0.0"
tempfile = "3.27.0"

# Database
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34.0"

# Logging
tracing = "0.1.43"

# Identity & Crypto
uuid = { version = "1.23.2", features = ["serde", "v4"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10.1"
sha2 = "0.11.0"
base64 = "0.22.1"
blake3 = "1.8.5"
rpassword = "7.5.3"

# Extra utilities
indexmap = { version = "2.14.0", features = ["serde"] }
once_cell = "1.21.4"
walkdir = "2.5"
futures = "0.3.32"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

# Web framework
axum = { version = "0.8.6", default-features = false, features = [
    "form",
    "http1",
    "json",
    "query",
    "tokio",
] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.11", default-features = false, features = [
    "cors",
] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.test]
inherits = "dev"

[profile.test.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = false
