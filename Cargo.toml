[workspace]
members = ["crates/ccr", "crates/ccr-db", "crates/ccr-types"]
default-members = ["crates/ccr"]
resolver = "3"

[workspace.package]
version = "5.0.7"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

# CLI
clap = { version = "4.5.60", features = ["cargo", "derive"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# HTTP client
# Note: default-features = false disables rustls + aws-lc-rs (needs cmake/C build).
# native-tls uses the OS TLS stack (SChannel on Windows), much faster to compile.
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "native-tls",
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"

# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Utilities
dirs = "6.0.0"
tempfile = "3.26.0"

# Web framework
axum = { version = "0.8.6", default-features = false, features = [
    "form",
    "http1",
    "json",
    "query",
    "tokio",
] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.8", default-features = false, features = [
    "cors",
] }

[profile.dev]
debug = 1
incremental = true
opt-level = 1

[profile.test]
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = false
