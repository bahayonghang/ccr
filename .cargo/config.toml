# Cargo 配置文件 - 优化开发体验
# Profile 配置统一由根 Cargo.toml 管理，此处仅配置构建工具链。

[build]
# debuginfo=1：提供基本行号信息，平衡调试体验与编译速度。
# /DEBUG:FASTLINK：让 MSVC linker 生成快速 PDB（2~3x 链接加速）。
rustflags = ["-C", "debuginfo=1", "-C", "link-arg=/DEBUG:FASTLINK"]

# 增量编译（默认已启用，显式声明以防意外关闭）
incremental = true

# 提示：快速开发命令
# - cargo check                     # 快速语法检查（不生成二进制）
# - cargo build                     # 开发构建
# - cargo build --release           # 发布构建（完全优化）
# - cargo build --no-default-features # 仅 CLI（最快）
