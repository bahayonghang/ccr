# Codex CLI config.toml example for DeepSeek
# Generated by CCR after switching a provider_bearer_token profile.
# Requires Codex >= 0.144.0 and a DeepSeek-compatible models.json catalog.
# Never commit this file or its backups after replacing the placeholder key.

model = "deepseek-v4-flash"
model_provider = "custom"
preferred_auth_method = "apikey"
forced_login_method = "api"
model_reasoning_effort = "high"
model_catalog_json = "~/.codex/models.json"

[model_providers.custom]
name = "DeepSeek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"
requires_openai_auth = false
experimental_bearer_token = "<DEEPSEEK_API_KEY>"
