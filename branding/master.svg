<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CCR brand master</title>
  <desc id="desc">Reference master for the CCR rounded-square prism badge brand system.</desc>
  <defs>
    <linearGradient id="badgeFill" x1="116" y1="102" x2="394" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F29A68"/>
      <stop offset="0.56" stop-color="#E87C58"/>
      <stop offset="1" stop-color="#D96543"/>
    </linearGradient>
    <linearGradient id="badgeHighlight" x1="144" y1="122" x2="332" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="badgeShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#A94A2D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g id="badge" filter="url(#badgeShadow)">
    <rect x="88" y="88" width="336" height="336" rx="122" fill="url(#badgeFill)"/>
    <path
      d="M132 126C184 102 266 102 338 132C382 151 405 178 418 204V88H88V190C96 166 110 144 132 126Z"
      fill="url(#badgeHighlight)"
    />
  </g>

  <g id="monogram" fill="none" stroke="#FFF8F2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M164 292 236 190H332L388 258 318 356H216Z" stroke-width="32"/>
    <path d="M236 190 294 258 216 356" stroke-width="28"/>
  </g>
</svg>
