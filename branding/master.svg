<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
  role="img" aria-labelledby="title desc">
  <title id="title">CCR Dual Runtime Router brand master</title>
  <desc id="desc">A unified C-shaped control plane encloses two runtime routes that converge into a CLI execution chevron.</desc>
  <defs>
    <linearGradient id="tile" x1="150" y1="110" x2="890" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A221E"/>
      <stop offset="1" stop-color="#17120F"/>
    </linearGradient>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#tile)"/>
  <rect x="68" y="68" width="888" height="888" rx="205"
        fill="none" stroke="#F3EADF" stroke-opacity="0.09" stroke-width="6"/>

  <!-- Unified CCR entrypoint / outer C. -->
  <path d="M735 280 A300 300 0 1 0 735 744"
        fill="none" stroke="#F3EADF" stroke-width="106"
        stroke-linecap="round" filter="url(#symbolShadow)"/>

  <!-- Explicit Claude Runtime and Codex Runtime / inner split C. -->
  <path d="M650 390 A176 176 0 0 0 372 512"
        fill="none" stroke="#E79A77" stroke-width="72"
        stroke-linecap="round"/>
  <path d="M372 512 A176 176 0 0 0 650 634"
        fill="none" stroke="#7CAB82" stroke-width="72"
        stroke-linecap="round"/>

  <!-- Both runtime paths converge into the same CLI execution direction. -->
  <path d="M650 390 C650 442 674 472 712 492"
        fill="none" stroke="#E79A77" stroke-width="72"
        stroke-linecap="round"/>
  <path d="M650 634 C650 582 674 552 712 532"
        fill="none" stroke="#7CAB82" stroke-width="72"
        stroke-linecap="round"/>

  <!-- CLI prompt / selected route. -->
  <path d="M706 430 L796 512 L706 594"
        fill="none" stroke="#F3EADF" stroke-width="68"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
