[package]
name = "ccr-types"
version.workspace = true
edition = "2024"
rust-version = "1.88"
authors = ["Yonghang Li"]
description = "Shared type definitions for CCR ecosystem"
license = "MIT"
repository = "https://github.com/bahayonghang/ccr"
keywords = ["ccr", "types", "shared"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21", features = ["v4", "serde"] }
