[package]
name = "ccr-usage"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Yonghang Li"]
description = "CCR read-only llmusage projections"
license = "MIT"
repository = "https://github.com/bahayonghang/ccr"

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dirs = { workspace = true }
iana-time-zone = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# 生成 TypeScript 绑定（ccr-ui 桌面端启用）；默认关闭，CLI 依赖图零变化。
ts = ["dep:ts-rs"]
# 测试专用 llmusage 投影 fixture（本 crate 与 src-tauri dev-dependency 共用）；
# 默认关闭，零新增依赖（rusqlite 已是正式依赖）。
test-fixtures = []

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
