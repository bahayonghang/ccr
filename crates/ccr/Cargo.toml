[package]
name = "ccr"
version.workspace = true
edition = "2024"
rust-version = "1.90"
authors = ["Yonghang Li"]
description = "Claude Code Configuration Switcher (Rust implementation)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bahayonghang/ccr"
keywords = ["cli", "config", "claude"]
categories = ["command-line-utilities", "config"]

[lib]
name = "ccr"
path = "src/lib.rs"

[[bin]]
name = "ccr"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ccr-tui", "ccr-cli/tui"]

# 依赖收敛为 src 真实引用集（facade 收拢，见 .trellis/tasks/07-03-arch-ccr-facade）
[dependencies]
ccr-cli = { path = "../ccr-cli" }
ccr-core = { path = "../ccr-core" }
ccr-store = { path = "../ccr-store" }
ccr-tui = { path = "../ccr-tui", optional = true }
clap = { workspace = true }
tokio = { workspace = true }

# 仅集成测试消费（tests/commands 等）
[dev-dependencies]
ccr-config = { path = "../ccr-config" }
filetime = "0.2.27"
indexmap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
