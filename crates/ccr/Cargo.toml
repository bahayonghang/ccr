[package]
name = "ccr"
version = "5.0.0"
edition = "2024"
rust-version = "1.90"
authors = ["Yonghang Li"]
description = "Claude Code Configuration Switcher (Rust implementation)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bahayonghang/ccr"
keywords = ["cli", "config", "claude"]
categories = ["command-line-utilities", "config"]

[lib]
name = "ccr"
path = "src/lib.rs"

[[bin]]
name = "ccr"
path = "src/main.rs"

[features]
default = ["web", "tui"]
tui = ["dep:crossterm", "dep:ratatui"]
web = ["dep:axum", "dep:open", "dep:sysinfo", "dep:tower", "dep:tower-http"]

[dependencies]
anyhow = { workspace = true }
ccr-types = { path = "../ccr-types" }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

base64 = "0.22.1"
blake3 = "1.8.3"
colored = "3.1.1"
comfy-table = "7.2.2"
dialoguer = "0.12.0"
filetime = "0.2.27"
fs4 = "0.13.1"
indexmap = { version = "2.13.0", features = ["serde"] }
once_cell = "1.21"
r2d2 = "0.8"
r2d2_sqlite = "0.32.0"
rayon = "1.11"
reqwest_dav = "0.3.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
toml_edit = "0.23.9"
tracing = "0.1.43"
tracing-appender = "0.2.4"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
whoami = "=2.1.0"

axum = { workspace = true, optional = true }
crossterm = { version = "0.29.0", optional = true }
open = { version = "5.3.3", optional = true }
ratatui = { version = "0.30.0", optional = true }
sysinfo = { version = "0.38.3", optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
