[package]
name = "ccr"
version.workspace = true
edition = "2024"
rust-version = "1.90"
authors = ["Yonghang Li"]
description = "Claude Code Configuration Switcher (Rust implementation)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bahayonghang/ccr"
keywords = ["cli", "config", "claude"]
categories = ["command-line-utilities", "config"]

[lib]
name = "ccr"
path = "src/lib.rs"

[[bin]]
name = "ccr"
path = "src/main.rs"

[features]
default = ["web", "tui"]
tui = ["dep:crossterm", "dep:ratatui"]
web = ["dep:axum", "dep:open", "dep:sysinfo", "dep:tower", "dep:tower-http"]

[dependencies]
anyhow = { workspace = true }
ccr-types = { path = "../ccr-types" }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

base64 = { workspace = true }
blake3 = { workspace = true }
colored = "3.1.1"
comfy-table = "7.2.2"
dialoguer = "0.12.0"
filetime = "0.2.27"
fs4 = "0.13.1"
indexmap = { workspace = true }
once_cell = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rayon = "1.11"
reqwest_dav = { version = "0.3.3", default-features = false, features = ["native-tls"] }
rusqlite = { workspace = true }
toml_edit = "0.23.9"
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { workspace = true }
whoami = "=2.1.0"

axum = { workspace = true, optional = true }
crossterm = { version = "0.29.0", optional = true }
open = { version = "5.3.3", optional = true }
ratatui = { version = "0.30.0", optional = true }
sysinfo = { version = "0.38.3", optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
