[package]
name = "ccr-config"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Yonghang Li"]
description = "Shared CCR configuration contracts and platform profile registry helpers"
license = "MIT"
repository = "https://github.com/bahayonghang/ccr"

[features]
test-support = []

[dependencies]
ccr-core = { path = "../ccr-core" }
ccr-types = { path = "../ccr-types" }
chrono = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }

[lib]
name = "ccr_config"
path = "src/lib.rs"
