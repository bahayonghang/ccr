[package]
name = "ccr-app"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Framework-independent application orchestration for CCR desktop clients"

[features]
test-fixtures = []

[dependencies]
base64 = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
ccr-config = { path = "../ccr-config" }
ccr-core = { path = "../ccr-core" }
ccr-types = { path = "../ccr-types" }
ccr-skills = { path = "../ccr-skills" }
ccr-db = { path = "../ccr-db" }
ccr-store = { path = "../ccr-store" }
ccr-usage = { path = "../ccr-usage" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
toml = "=1.1.8"
walkdir = "=2.5.0"
async-channel = "2.5.0"
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"

[dev-dependencies]
ccr-usage = { path = "../ccr-usage", features = ["test-fixtures"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
