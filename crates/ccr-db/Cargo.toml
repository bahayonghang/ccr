[package]
name = "ccr-db"
version = "5.0.7"
edition = "2024"
rust-version = "1.88"
description = "CCR Desktop database layer - SQLite storage, CheckIn services, and data models"

[dependencies]
ccr-types = { path = "../ccr-types" }
# ═══════════════════════════════════════════════════════════
# 📦 数据库
# ═══════════════════════════════════════════════════════════
rusqlite = { version = "0.38.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32.0"

# ═══════════════════════════════════════════════════════════
# 📦 序列化
# ═══════════════════════════════════════════════════════════
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.33"

# ═══════════════════════════════════════════════════════════
# 📦 时间与标识
# ═══════════════════════════════════════════════════════════
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }

# ═══════════════════════════════════════════════════════════
# 📦 错误处理与日志
# ═══════════════════════════════════════════════════════════
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.43"

# ═══════════════════════════════════════════════════════════
# 📦 加密 (签到账号凭据保护)
# ═══════════════════════════════════════════════════════════
aes-gcm = "0.10"
rand = "0.10.0"
base64 = "0.22"
sha2 = "0.10.9"

# ═══════════════════════════════════════════════════════════
# 📦 异步运行时与 HTTP
# ═══════════════════════════════════════════════════════════
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "fs",
    "macros",
    "sync",
    "time",
    "process",
] }
async-stream = "0.3"
futures = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "cookies",
    "gzip",
    "native-tls",
] }

# ═══════════════════════════════════════════════════════════
# 📦 文件系统与工具
# ═══════════════════════════════════════════════════════════
dirs = "6.0.0"
tempfile = "3.26.0"
walkdir = "2.5"
once_cell = "1.21"
indexmap = "2.13.0"
scraper = "0.25.0"
toml = "0.8"
