[package]
name = "ccr-cli"
version.workspace = true
edition = "2024"
rust-version = "1.95"
authors = ["Yonghang Li"]
description = "CCR CLI/application domain crate"
license = "MIT"
repository = "https://github.com/bahayonghang/ccr"

[features]
default = []
tui = []
ts = ["dep:ts-rs"]

[lib]
name = "ccr_cli"
path = "src/lib.rs"

[dependencies]
ccr-core = { path = "../ccr-core" }
ccr-config = { path = "../ccr-config" }
ccr-sync = { path = "../ccr-sync" }
ccr-skills = { path = "../ccr-skills" }
ccr-store = { path = "../ccr-store" }
ccr-codex = { path = "../ccr-codex" }
ccr-types = { path = "../ccr-types" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
colored = "3.1.1"
comfy-table = "8.0.0"
dialoguer = "0.12.0"
filetime = "0.2.29"
futures = { workspace = true }
fs4 = "1.1.0"
indexmap = { workspace = true }
once_cell = { workspace = true }
rayon = "1.12.0"
reqwest_dav = { version = "0.3.3", default-features = false, features = ["native-tls"] }
rpassword = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
open = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
urlencoding = "2.1.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
unicode-width = "0.2.2"
