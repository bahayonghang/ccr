[package]
name = "ccr-cli"
version.workspace = true
edition = "2024"
rust-version = "1.90"
authors = ["Yonghang Li"]
description = "CCR CLI/application domain crate"
license = "MIT"
repository = "https://github.com/bahayonghang/ccr"

[features]
default = []
tui = []

[lib]
name = "ccr_cli"
path = "src/lib.rs"

[dependencies]
ccr-core = { path = "../ccr-core" }
ccr-config = { path = "../ccr-config" }
ccr-sync = { path = "../ccr-sync" }
ccr-skills = { path = "../ccr-skills" }
ccr-store = { path = "../ccr-store" }
ccr-codex = { path = "../ccr-codex" }
ccr-types = { path = "../ccr-types" }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
colored = "3.1.1"
comfy-table = "7.2.2"
dialoguer = "0.12.0"
filetime = "0.2.27"
futures = { workspace = true }
fs4 = "0.13.1"
indexmap = { workspace = true }
once_cell = { workspace = true }
rayon = "1.11"
reqwest_dav = { version = "0.3.3", default-features = false, features = ["native-tls"] }
rpassword = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.4"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { workspace = true }
walkdir = { workspace = true }
urlencoding = "2.1.3"
sysinfo = { version = "0.38.3", default-features = false, features = ["system"] }
unicode-width = "0.2.2"
